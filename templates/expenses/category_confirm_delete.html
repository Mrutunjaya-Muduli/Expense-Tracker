{% extends 'base.html' %}

{% block title %}Delete Category - Smart Expense Tracker{% endblock %}

{% block content %}
<div class="row justify-content-center align-items-center py-5">
    <div class="col-12 col-md-6 col-lg-5">
        <div class="glass-card p-4 p-md-5 text-center">
            <div class="rounded-circle bg-rose-glow mx-auto d-flex align-items-center justify-content-center mb-4" style="width: 70px; height: 70px;">
                <i class="bi bi-trash3 text-danger fs-2"></i>
            </div>
            <h4 class="fw-bold text-white mb-2">Delete Category?</h4>
            <p class="text-secondary mb-4">Are you sure you want to delete category <strong class="text-white">"{{ category.category_name }}"</strong>?</p>

            <form method="POST">
                {% csrf_token %}
                <div class="d-flex justify-content-center gap-3">
                    <a href="{% url 'category_list' %}" class="btn btn-outline-secondary px-4">Cancel</a>
                    <button type="submit" class="btn btn-danger px-4 fw-semibold">Delete</button>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
